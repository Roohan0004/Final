name: wf-ci-release
on:
  pull_request:
    branches:
      - release/**
jobs:
  wf-ci-release-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref}}
      - name: Lint HTML and CSS files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Build and Test
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist"
